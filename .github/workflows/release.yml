name: release

# Triggers:
#   - tag vX.Y.Z                              -> stable vX.Y.Z
#   - commit msg contains "release vX.Y.Z"    -> stable vX.Y.Z
#   - commit msg contains "prerelease"        -> prerelease at (latest stable + patch)
#   - manual workflow_dispatch                -> prerelease at (latest stable + patch)

on:
  push:
    branches: [main, dev]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # MARK: parse trigger + move rolling tag --------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      title: ${{ steps.parse.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Parse trigger
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tag=""; prerelease=""; title=""
          msg=$(git log -1 --pretty=%s)

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # tag push -> stable
            tag="${GITHUB_REF#refs/tags/}"; prerelease=false; title="$tag"
          elif [[ "$msg" =~ release[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
            # explicit "release vX.Y.Z" commit -> stable
            tag="${BASH_REMATCH[1]}"; prerelease=false; title="$tag"
          elif [[ "$msg" == *prerelease* || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # prerelease -> next patch above the latest published stable release
            base=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name 2>/dev/null || true)
            base="${base:-v0.0.0}"
            IFS='.' read -r maj min pat <<< "${base#v}"
            tag="v${maj}.${min}.$((pat + 1))"
            prerelease=true; title="🧪 ${tag} - Prerelease"
          fi

          echo "tag=$tag"               >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "title=$title"           >> "$GITHUB_OUTPUT"

      - name: Move rolling tag
        if: steps.parse.outputs.tag && steps.parse.outputs.prerelease == 'true'
        env:
          TAG: ${{ steps.parse.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag=false 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG"
          git push origin "refs/tags/$TAG" --force

  # MARK: build the wheel + sdist ----------------------------------------
  build:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      # Pure-Python package: one wheel works on every OS. `uv tool install`
      # consumes either the wheel or the sdist.
      - name: Build distributions
        run: uv build --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # MARK: combined release -----------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: needs.prepare.outputs.tag
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: release/

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.title }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          body: |
            ## Install

            Installs as a [uv](https://docs.astral.sh/uv/) tool (`fhds` on your PATH):

            ```
            uv tool install git+https://github.com/${{ github.repository }}@${{ needs.prepare.outputs.tag }}
            ```

            Or grab the attached `fhds-*.whl` / `fhds-*.tar.gz` and `uv tool install <file>`.

            ---
            > **Heads up**
            > - Settings live in `user_preferences.json` in your per-user data directory.
            > - Linux: install `70-dualsense.rules` to `/etc/udev/rules.d/` for HID access.
          files: release/*
