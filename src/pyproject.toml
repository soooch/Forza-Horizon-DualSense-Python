[project]
name = "fhds"
version = "1.6.2"
description = "Forza Horizon DualSense adaptive triggers (Steam keeps rumble)."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "customtkinter>=5.2.2",
    "hidapi>=0.15.0",
    "pillow>=11.0.0",
    "psutil>=7.2.2",
    "pystray>=0.19.5",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "textual>=8.2.5",
    "PyGObject>=3.42.0; sys_platform == 'linux'",
]

[tool.pyrefly]
project-includes = ["src"]
search-path = ["src"]
ignore-errors-in-generated-code = true
python-interpreter-path = ".venv/Scripts/python.exe"

[tool.pyrefly.errors]
bad-argument-type = false
implicit-import = false
bad-assignment = false
bad-return = false
missing-attribute = false
bad-function-definition = false
no-matching-overload = false

[tool.zuv]
entry = "fhds/main.py"
volume = "fhds/data"

[tool.ruff]
line-length = 120

[tool.uv.sources]
